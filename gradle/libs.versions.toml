# Versions are pinned to what Android Studio Giraffe (2022.3.1) can open:
# it supports Android Gradle Plugin up to 8.1.x. After updating Android Studio,
# raise agp, kotlin and composeBom together, and replace composeCompiler with
# the org.jetbrains.kotlin.plugin.compose Gradle plugin (Kotlin 2.0+).
[versions]
agp = "8.1.4"
kotlin = "1.9.22"
# Must match the Kotlin version: 1.5.10 pairs with Kotlin 1.9.22.
composeCompiler = "1.5.10"
# KSP version must start with the Kotlin version.
ksp = "1.9.22-1.0.17"
composeBom = "2024.02.00"
coreKtx = "1.12.0"
activityCompose = "1.8.2"
lifecycle = "2.7.0"
room = "2.6.1"
# Frosted-glass blur of whatever scrolls under the bottom bar. 1.x records
# the content and blurs it in the same frame (0.7.x lagged a frame and
# flickered), and adds progressive blur. It lifts Compose ui/foundation to
# 1.7.5 through dependency resolution; material3 stays on the BOM's 1.2.x.
haze = "1.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
